<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - Sector 7 Reports</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #222; color: #fff; }
    input, textarea, select { width: 100%; box-sizing: border-box; }
    .file-row { display: flex; align-items: center; gap: 0.5rem; }
    .file-row button { flex-shrink: 0; }
    .annotation { width: 100%; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <h1>Admin Panel - Sector 7 Reports</h1>
  </header>

  <section>
    <label for="adminToken">Admin Token:</label>
    <input type="password" id="adminToken" placeholder="Enter admin token" />
    <button id="loadReportsBtn">Load Reports</button>
  </section>

  <section id="reportsSection">
    <table id="reportsTable">
      <thead>
        <tr>
          <th>Code</th>
          <th>Submitted</th>
          <th>Status</th>
          <th>Title</th>
          <th>Notes</th>
          <th>Files</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

<script>
const workerBase = "https://submit.wampired2.workers.dev";

document.getElementById("loadReportsBtn").addEventListener("click", async () => {
  const token = document.getElementById("adminToken").value.trim();
  if (!token) return alert("Enter admin token");

  try {
    const res = await fetch(workerBase + `/admin/list?token=${encodeURIComponent(token)}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    populateReports(data.reports, token);
  } catch (err) {
    alert("Error loading reports: " + err.message);
  }
});

async function populateReports(reports, token) {
  const tbody = document.querySelector("#reportsTable tbody");
  tbody.innerHTML = "";

  for (const r of reports) {
    const tr = document.createElement("tr");

    const statusSelect = document.createElement("select");
    ["Received","In Review","Closed","Rejected"].forEach(s => {
      const opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s;
      if (s === r.status) opt.selected = true;
      statusSelect.appendChild(opt);
    });

    const notesInput = document.createElement("textarea");
    notesInput.rows = 2;
    notesInput.value = r.notes || "";

    // Fetch files for this report
    const filesRes = await fetch(workerBase + "/check", {
      method: "POST",
      body: new FormData(Object.assign(new FormData(), { append: (k,v)=>k==="report_code"?v:null })),
    });
    let files = [];
    try {
      const formData = new FormData();
      formData.append("report_code", r.report_code);
      const fr = await fetch(workerBase + "/check", { method:"POST", body: formData });
      if (fr.ok) files = (await fr.json()).files;
    } catch(e){ console.error(e); }

    const filesTd = document.createElement("td");
    files.forEach(f => {
      const row = document.createElement("div");
      row.className = "file-row";
      const link = document.createElement("a");
      link.href = workerBase + `/admin/download?token=${encodeURIComponent(token)}&kv_key=${encodeURIComponent(f.kv_key)}`;
      link.textContent = f.orig_filename + ` (${f.bytes} bytes)`;
      link.target = "_blank";

      const annotation = document.createElement("input");
      annotation.placeholder = "Add annotation";
      annotation.className = "annotation";

      row.appendChild(link);
      row.appendChild(annotation);
      filesTd.appendChild(row);
    });

    const actionsTd = document.createElement("td");
    const saveBtn = document.createElement("button");
    saveBtn.textContent = "Save";
    saveBtn.addEventListener("click", async () => {
      try {
        const formData = new FormData();
        formData.append("token", token);
        formData.append("report_code", r.report_code);
        formData.append("status", statusSelect.value);
        formData.append("notes", notesInput.value);

        const res = await fetch(workerBase + "/admin/update", { method: "POST", body: formData });
        if (!res.ok) throw new Error(await res.text());
        alert("Updated successfully!");
      } catch (err) {
        alert("Error updating: " + err.message);
      }
    });

    tr.innerHTML = `<td>${r.report_code}</td>
                    <td>${r.submitted_at}</td>
                    <td></td>
                    <td>${r.title}</td>
                    <td></td>
                    <td></td>
                    <td></td>`;

    tr.children[2].appendChild(statusSelect);
    tr.children[4].appendChild(notesInput);
    tr.children[5].appendChild(filesTd);
    tr.children[6].appendChild(saveBtn);

    tbody.appendChild(tr);
  }
}
</script>
</body>
</html>
