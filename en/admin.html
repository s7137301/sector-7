<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel - Sector 7 Reports</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    th { background: #222; color: #fff; }
    input, textarea, select { width: 100%; box-sizing: border-box; }
    .file-row { display: flex; align-items: center; gap: 0.5rem; }
    .file-row button { flex-shrink: 0; }
    .annotation { width: 100%; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <header>
    <h1>Admin Panel - Sector 7 Reports</h1>
  </header>

  <section>
    <label for="adminToken">Admin Token:</label>
    <input type="password" id="adminToken" placeholder="Enter admin token" />
    <button id="loadReportsBtn">Load Reports</button>
  </section>

  <section id="reportsSection">
    <table id="reportsTable">
      <thead>
        <tr>
          <th>Code</th>
          <th>Submitted</th>
          <th>Status</th>
          <th>Title</th>
          <th>Notes</th>
          <th>Files</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

<script>
const workerBase = "https://submit.wampired2.workers.dev";
const adminToken = prompt("Enter admin token"); // or store securely

const reportsTable = document.getElementById("reportsTable");

// Fetch and populate reports
async function populateReports(statusFilter = "") {
  try {
    const url = new URL(workerBase + "/admin/list");
    url.searchParams.set("token", adminToken);
    if (statusFilter) url.searchParams.set("status", statusFilter);

    const res = await fetch(url.toString(), { method: "GET" });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    // Clear table
    reportsTable.innerHTML = "";

    data.reports.forEach(report => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${report.report_code}</td>
        <td>${report.submitted_at}</td>
        <td>
          <select class="status-select">
            <option ${report.status === "Received" ? "selected" : ""}>Received</option>
            <option ${report.status === "In Review" ? "selected" : ""}>In Review</option>
            <option ${report.status === "Resolved" ? "selected" : ""}>Resolved</option>
          </select>
        </td>
        <td>
          <button class="view-btn">View Files</button>
        </td>
        <td>
          <textarea class="notes-input" placeholder="Add notes...">${report.notes || ""}</textarea>
        </td>
        <td>
          <button class="save-btn">Save</button>
        </td>
      `;

      // View/download files
      row.querySelector(".view-btn").addEventListener("click", async () => {
        const filesRes = await fetch(workerBase + "/check", {
          method: "POST",
          body: new FormData().append("report_code", report.report_code),
          mode: "cors"
        });
        if (!filesRes.ok) {
          alert("Failed to fetch files");
          return;
        }
        const result = await filesRes.json();
        const fileList = result.files.map(f => {
          return `<li>
            <a href="${workerBase}/admin/download?token=${adminToken}&kv_key=${f.kv_key}" target="_blank">${f.orig_filename}</a>
            <input type="text" placeholder="Annotation" data-kv="${f.kv_key}" class="annotation-input">
          </li>`;
        }).join("");
        const fileDiv = document.createElement("div");
        fileDiv.innerHTML = `<ul>${fileList}</ul>`;
        row.appendChild(fileDiv);
      });

      // Save notes/status
      row.querySelector(".save-btn").addEventListener("click", async () => {
        const status = row.querySelector(".status-select").value;
        const notes = row.querySelector(".notes-input").value;

        const formData = new FormData();
        formData.append("token", adminToken);
        formData.append("report_code", report.report_code);
        formData.append("status", status);
        formData.append("notes", notes);

        try {
          const res = await fetch(workerBase + "/admin/update", {
            method: "POST",
            body: formData
          });
          if (!res.ok) throw new Error(await res.text());
          alert("Saved successfully!");
        } catch (err) {
          alert("Error saving: " + err.message);
        }

        // Save file annotations if any
        row.querySelectorAll(".annotation-input").forEach(async input => {
          const kv = input.dataset.kv;
          const annotation = input.value;
          if (!annotation) return;

          const af = new FormData();
          af.append("token", adminToken);
          af.append("kv_key", kv);
          af.append("annotation", annotation);

          try {
            await fetch(workerBase + "/admin/file-annotation", {
              method: "POST",
              body: af
            });
          } catch (err) {
            console.error("Failed to save annotation:", err);
          }
        });
      });

      reportsTable.appendChild(row);
    });

  } catch (err) {
    console.error("Error populating reports:", err);
  }
}

// Initialize
document.addEventListener("DOMContentLoaded", () => {
  populateReports();
});
</script>

</body>
</html>
