<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sector 7 – Admin</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 16px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .grid { display: grid; gap: 12px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
    .muted { color: #666; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #eee; padding: 8px; text-align: left; vertical-align: top; }
    .btn { padding: 6px 10px; border: 1px solid #aaa; border-radius: 8px; background: #fafafa; cursor: pointer; }
    .btn:hover { background: #f0f0f0; }
    textarea, select, input[type="text"] { width: 100%; padding: 6px; }
    details > summary { cursor: pointer; font-weight: 600; }
    code { background: #f7f7f7; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>

  <div class="card grid" style="max-width: 700px;">
    <label>Worker Base URL
      <input id="base" type="text" value="https://submit.wampired2.workers.dev"/>
    </label>
    <label>Admin Token
      <input id="token" type="text" placeholder="paste ADMIN_TOKEN"/>
    </label>
    <div class="row">
      <div></div>
      <button id="loadReports" class="btn">Load Reports</button>
    </div>
    <label>Status Filter (optional)
      <input id="statusFilter" type="text" placeholder="e.g. Received / In Review / Closed"/>
    </label>
  </div>

  <div id="reports" class="grid" style="margin-top: 16px;"></div>

  <script>
    const el = (sel) => document.querySelector(sel);
    const mk = (tag, props = {}, children = []) => {
      const n = document.createElement(tag);
      Object.entries(props).forEach(([k,v]) => (k in n) ? n[k] = v : n.setAttribute(k, v));
      children.forEach(c => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
      return n;
    };

    el("#loadReports").addEventListener("click", populateReports);

    async function apiGet(path) {
      const base = el("#base").value.trim();
      const token = encodeURIComponent(el("#token").value.trim());
      const u = `${base}${path}${path.includes("?") ? "&" : "?"}token=${token}`;
      const res = await fetch(u, { mode: "cors" });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    async function apiPost(path, data) {
      const base = el("#base").value.trim();
      const form = new FormData();
      Object.entries(data).forEach(([k, v]) => form.append(k, v));
      const res = await fetch(`${base}${path}`, { method: "POST", body: form, mode: "cors" });
      if (!res.ok) throw new Error(await res.text());
      return res.text();
    }

    async function populateReports() {
      const base = el("#base").value.trim();
      const token = el("#token").value.trim();
      if (!base || !token) { alert("Enter base URL and admin token"); return; }

      const filter = el("#statusFilter").value.trim();
      const q = filter ? `/admin/list?status=${encodeURIComponent(filter)}` : "/admin/list";
      const { reports } = await apiGet(q);

      const out = el("#reports");
      out.innerHTML = "";

      reports.forEach(r => {
        const reportCard = mk("div", { className: "card grid" }, [
          mk("div", {}, [
            mk("div", { className: "row" }, [
              mk("div", {}, [ mk("strong", {}, [`${r.title || "(no title)"}`]) ]),
              mk("div", {}, [ mk("span", { className: "muted" }, [r.submitted_at]) ])
            ]),
            mk("div", { className: "muted" }, [`Code: `, mk("code", {}, [r.report_code]), ` • Status: ${r.status}`])
          ]),
          mk("div", {}, [
            mk("details", {}, [
              mk("summary", {}, ["Open details / files"]),
              mk("div", { style: "margin-top:8px" }, [
                mk("div", { className: "grid", style: "max-width:700px;" }, [
                  mk("label", {}, ["Update report status",
                    mk("select", { id: `status-${r.report_code}` }, [
                      "Received","In Review","Closed"
                    ].map(s => mk("option", { value: s, selected: s === r.status }, [s])))
                  ]),
                  mk("label", {}, ["Report notes",
                    mk("textarea", { id: `notes-${r.report_code}`, rows: 3 })
                  ]),
                  mk("div", { className: "row" }, [
                    mk("div"),
                    mk("button", {
                      className: "btn",
                      onclick: async () => {
                        try {
                          await apiPost("/admin/update", {
                            token,
                            report_code: r.report_code,
                            status: el(`#status-${r.report_code}`).value,
                            notes:  el(`#notes-${r.report_code}`).value
                          });
                          alert("Report updated");
                        } catch (e) { alert("Update failed: " + e.message); }
                      }
                    }, ["Save report"])
                  ]),
                  mk("div", {}, [ mk("h4", {}, ["Files"]) ]),
                  mk("div", { id: `files-${r.report_code}` }, [ mk("div", { className: "muted" }, ["Loading files..."]) ])
                ])
              ])
            ])
          ])
        ]);

        out.appendChild(reportCard);

        // Load files for each report
        populateFiles(r.report_code);
      });
    }

    async function populateFiles(reportCode) {
      try {
        const { files } = await apiGet(`/admin/files?report_code=${encodeURIComponent(reportCode)}`);
        const wrap = el(`#files-${CSS.escape(reportCode)}`);
        if (!files.length) {
          wrap.innerHTML = "<div class='muted'>No files</div>";
          return;
        }

        const tbl = mk("table", {}, [
          mk("thead", {}, [
            mk("tr", {}, [
              mk("th", {}, ["Filename"]),
              mk("th", {}, ["Size"]),
              mk("th", {}, ["SHA256"]),
              mk("th", {}, ["Status"]),
              mk("th", {}, ["Notes"]),
              mk("th", {}, ["Actions"])
            ])
          ]),
          mk("tbody", {},
            files.map(f => mk("tr", {}, [
              mk("td", {}, [ f.filename ]),
              mk("td", {}, [ String(f.bytes || 0) ]),
              mk("td", {}, [ mk("code", {}, [ f.sha256_hex || "" ]) ]),
              mk("td", {}, [
                mk("select", { id: `fstat-${f.id}` }, [
                  "pending","safe","malicious","restricted"
                ].map(s => mk("option", { value: s, selected: s === (f.status || "pending") }, [s])))
              ]),
              mk("td", {}, [
                mk("textarea", { id: `fnotes-${f.id}`, rows: 2 }, [ f.notes || "" ])
              ]),
              mk("td", {}, [
                mk("a", {
                  href: `${el("#base").value.trim()}/file/${encodeURIComponent(f.id)}?token=${encodeURIComponent(el("#token").value.trim())}`,
                  target: "_blank",
                  className: "btn"
                }, ["Open"]),
                document.createTextNode(" "),
                mk("a", {
                  href: `${el("#base").value.trim()}/file/${encodeURIComponent(f.id)}?token=${encodeURIComponent(el("#token").value.trim())}&download=1`,
                  className: "btn"
                }, ["Download"]),
                document.createTextNode(" "),
                mk("button", {
                  className: "btn",
                  onclick: async () => {
                    try {
                      await apiPost("/admin/file/update", {
                        token: el("#token").value.trim(),
                        id: f.id,
                        status: el(`#fstat-${f.id}`).value,
                        notes:  el(`#fnotes-${f.id}`).value
                      });
                      alert("File updated");
                    } catch (e) { alert("File update failed: " + e.message); }
                  }
                }, ["Save"])
              ])
            ]))
          )
        ]);

        wrap.innerHTML = "";
        wrap.appendChild(tbl);

      } catch (e) {
        const wrap = el(`#files-${CSS.escape(reportCode)}`);
        wrap.innerHTML = `<div class="muted">Failed to load files: ${e.message}</div>`;
      }
    }
  </script>
</body>
</html>
